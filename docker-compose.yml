services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-rag-web
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    volumes:
      # Persist runtime data across container restarts
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
